name: CI

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc

      - name: Run tests
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: lorem
          GITHUB_CLIENT_ID: ipsum
          GITHUB_CLIENT_SECRET: dolor
          NEXT_PUBLIC_BETTER_AUTH_URL: sit
          BETTER_AUTH_SECRET: amet
          ENABLE_API_MOCKING: consectetur
        run: npm run build
